<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Hsabati</title>
  <meta name="description" content="Mes dépenses par projet, en deux secondes.">
  <meta name="theme-color" content="#fbf6f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1d181b" media="(prefers-color-scheme: dark)">
  <script>
    // Apply a chosen light/dark theme before first paint (no flash while data loads).
    try {
      var t = localStorage.getItem('hsabati-theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Nunito:wght@500;600;700;800&display=swap">
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./src/main.tsx"></script>
</body>
</html>
